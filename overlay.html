<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      height: 100%;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .panel {
      background: rgba(13, 13, 16, 0.88);
      border: 1px solid rgba(0, 255, 100, 0.18);
      border-radius: 10px;
      margin: 10px;
      height: calc(100vh - 20px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Panel header (drag handle + controls) ── */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      border-bottom: 1px solid rgba(0, 255, 100, 0.1);
      flex-shrink: 0;
      -webkit-app-region: drag;   /* allow dragging the overlay here */
    }

    .panel-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: rgba(0, 255, 100, 0.4);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .font-controls {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .font-btn {
      background: rgba(0, 255, 100, 0.06);
      border: 1px solid rgba(0, 255, 100, 0.18);
      border-radius: 4px;
      color: rgba(0, 255, 100, 0.5);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 2px 7px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.12s, border-color 0.12s;
    }
    .font-btn:hover { color: #00ff64; border-color: rgba(0, 255, 100, 0.5); }

    /* ── Question section ── */
    .q-section {
      padding: 8px 14px 6px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    #question {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.5;
      max-height: 56px;
      overflow: hidden;
      white-space: pre-wrap;
    }

    /* ── Answer section ── */
    .a-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 8px 14px 10px;
      overflow: hidden;
    }

    .a-label-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .a-label-row .section-label { margin-bottom: 0; }

    #loader {
      display: none;
      color: rgba(0, 255, 100, 0.5);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 4px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50%       { opacity: 1; }
    }

    #answer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;   /* controlled by JS */
      color: #00ff64;
      line-height: 1.65;
      flex: 1;
      overflow-y: scroll;   /* always show scrollbar so user knows it's scrollable */
      white-space: pre-wrap;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 255, 100, 0.5) rgba(0, 255, 100, 0.06);
      outline: none;        /* needed for keyboard arrow-key scrolling */
    }
    #answer::-webkit-scrollbar { width: 6px; }
    #answer::-webkit-scrollbar-track { background: rgba(0,255,100,0.06); border-radius: 3px; }
    #answer::-webkit-scrollbar-thumb { background: rgba(0,255,100,0.45); border-radius: 3px; }
    #answer::-webkit-scrollbar-thumb:hover { background: rgba(0,255,100,0.75); }

    /* ── Markdown rendered answer (overlay) ── */
    #answer.rendered { white-space: normal; }

    #answer.rendered p { margin-bottom: 8px; }
    #answer.rendered p:last-child { margin-bottom: 0; }

    #answer.rendered ul, #answer.rendered ol {
      margin: 6px 0 8px 18px;
    }
    #answer.rendered li { margin-bottom: 3px; }

    #answer.rendered h1, #answer.rendered h2, #answer.rendered h3 {
      color: #00ff64;
      margin: 10px 0 4px;
      font-size: 0.9em;
    }

    #answer.rendered strong { color: #fff; }
    #answer.rendered em { color: rgba(0, 255, 100, 0.6); }

    /* Inline code in overlay */
    #answer.rendered code:not(pre code) {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 100, 0.2);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88em;
      color: #00e05a;
    }

    /* Code blocks in overlay */
    #answer.rendered pre {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 255, 100, 0.15);
      border-radius: 6px;
      overflow: hidden;
      margin: 8px 0;
    }

    .ov-code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 10px;
      border-bottom: 1px solid rgba(0, 255, 100, 0.1);
    }

    .ov-code-lang {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: rgba(0, 255, 100, 0.4);
    }

    .ov-copy-btn {
      background: none;
      border: 1px solid rgba(0, 255, 100, 0.2);
      border-radius: 3px;
      color: rgba(0, 255, 100, 0.4);
      font-size: 0.62rem;
      padding: 1px 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      transition: color 0.12s;
    }
    .ov-copy-btn:hover { color: #00ff64; }

    #answer.rendered pre code {
      display: block;
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      overflow-x: auto;
      background: transparent !important;
      color: #abb2bf;     /* atom-one-dark default text */
    }

    .hljs { background: transparent !important; }

    /* ── Capture bar ── */
    .capture-bar {
      padding: 6px 12px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    #btnCapture {
      width: 100%;
      background: rgba(0, 255, 100, 0.08);
      border: 1px solid rgba(0, 255, 100, 0.25);
      border-radius: 6px;
      color: #00ff64;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 6px 0;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s, border-color 0.15s;
    }
    #btnCapture:hover:not(:disabled) {
      background: rgba(0, 255, 100, 0.16);
      border-color: rgba(0, 255, 100, 0.5);
    }
    #btnCapture:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="panel">

    <!-- Drag handle + font controls -->
    <div class="panel-header">
      <div class="panel-title">Interview Copilot</div>
      <div class="font-controls">
        <button class="font-btn" id="btnFontMinus" title="Decrease font size">A−</button>
        <button class="font-btn" id="btnFontPlus"  title="Increase font size">A+</button>
      </div>
    </div>

    <!-- Capture button -->
    <div class="capture-bar">
      <button id="btnCapture">&#128247; Capture Screen</button>
    </div>

    <!-- Question -->
    <div class="q-section">
      <div class="section-label">Question</div>
      <div id="question">—</div>
    </div>

    <!-- Answer -->
    <div class="a-section">
      <div class="a-label-row">
        <div class="section-label">Answer</div>
        <div id="loader">● ● ●</div>
      </div>
      <div id="answer" tabindex="0">Waiting for a question…</div>
    </div>

  </div>

  <script>
    const questionEl = document.getElementById('question');
    const answerEl   = document.getElementById('answer');
    const loaderEl   = document.getElementById('loader');

    let rawAnswer = '';

    // Only auto-scroll when the user hasn't scrolled up to read.
    // If they're within 80px of the bottom, follow new content; otherwise stay put.
    function smartScroll() {
      const distFromBottom = answerEl.scrollHeight - answerEl.scrollTop - answerEl.clientHeight;
      if (distFromBottom < 80) answerEl.scrollTop = answerEl.scrollHeight;
    }

    // ── Font size ──
    const MIN_FONT = 10, MAX_FONT = 24;
    let fontSize = 14;
    try { fontSize = parseInt(localStorage.getItem('overlayFontSize') || '14'); } catch {}
    applyFontSize();

    function applyFontSize() {
      answerEl.style.fontSize = fontSize + 'px';
    }

    document.getElementById('btnFontMinus').addEventListener('click', () => {
      fontSize = Math.max(MIN_FONT, fontSize - 1);
      try { localStorage.setItem('overlayFontSize', fontSize); } catch {}
      applyFontSize();
    });

    document.getElementById('btnFontPlus').addEventListener('click', () => {
      fontSize = Math.min(MAX_FONT, fontSize + 1);
      try { localStorage.setItem('overlayFontSize', fontSize); } catch {}
      applyFontSize();
    });

    // ── Capture button ──
    const captureBtn = document.getElementById('btnCapture');

    captureBtn.addEventListener('click', async () => {
      captureBtn.textContent = '⏳ Capturing…';
      captureBtn.disabled = true;
      questionEl.textContent = '—';
      rawAnswer = '';
      answerEl.textContent = '';
      answerEl.className = '';
      loaderEl.style.display = 'block';

      try {
        const result = await window.copilot.captureScreen();
        if (!result.ok) {
          loaderEl.style.display = 'none';
          answerEl.textContent = '✗ Capture failed: ' + result.error;
        } else {
          captureBtn.textContent = '🤖 Analysing…';
          await window.copilot.answerFromScreenshot(result.dataUrl);
        }
      } catch (e) {
        loaderEl.style.display = 'none';
        answerEl.textContent = '✗ Error: ' + e.message;
      }

      captureBtn.textContent = '📷 Capture Screen';
      captureBtn.disabled = false;
    });

    // ── IPC callbacks ──
    window.copilot.onQuestionReceived((text) => {
      questionEl.textContent = text;
      rawAnswer = '';
      answerEl.textContent = '';
      answerEl.className = '';
      loaderEl.style.display = 'block';
    });

    window.copilot.onAnswerChunk((chunk) => {
      loaderEl.style.display = 'none';
      rawAnswer += chunk;
      answerEl.textContent = rawAnswer;   // plain text while streaming
      smartScroll();
    });

    window.copilot.onAnswerDone(() => {
      loaderEl.style.display = 'none';
      renderAnswer();
    });

    // ── Render markdown + code highlighting ──
    function renderAnswer() {
      if (!rawAnswer.trim()) return;
      answerEl.innerHTML = marked.parse(rawAnswer);
      answerEl.classList.add('rendered');

      answerEl.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        if (!code) return;

        hljs.highlightElement(code);

        const langClass = [...code.classList].find(c => c.startsWith('language-'));
        const lang = langClass ? langClass.replace('language-', '') : 'code';

        const hdr = document.createElement('div');
        hdr.className = 'ov-code-header';

        const langSpan = document.createElement('span');
        langSpan.className = 'ov-code-lang';
        langSpan.textContent = lang;

        const copyBtn = document.createElement('button');
        copyBtn.className = 'ov-copy-btn';
        copyBtn.textContent = 'copy';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(code.innerText).then(() => {
            copyBtn.textContent = 'ok!';
            setTimeout(() => { copyBtn.textContent = 'copy'; }, 1500);
          });
        });

        hdr.appendChild(langSpan);
        hdr.appendChild(copyBtn);
        pre.insertBefore(hdr, code);
      });

      smartScroll();
    }
  </script>
</body>
</html>
